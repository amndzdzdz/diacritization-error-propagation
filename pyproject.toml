[project]
name = "arabic-mdd"
version = "0.1.0"
description = "Reference-aware evaluation of diacritization error propagation in Arabic mispronunciation detection"
readme = "README.md"
authors = [
    { name = "amndzdzdz", email = "zorrofx@gmx.net" }
]
requires-python = ">=3.12"
dependencies = [
    # Pinned, not floored: the RQ4 confidence path in
    # `arabic_mdd.diacritizers.catt` reads this release's private internals.
    "catt-tashkeel==1.0.2",
    "datasets>=5.0.1",
    "mishkal>=0.4.1",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Terminal display only, for `scripts/verify_verse_map.py`: most terminals
    # apply no bidi pass, so diacritized Arabic has to be shaped and reordered
    # before printing. Nothing under `src/` imports these, and no result
    # depends on them. python-bidi is LGPL-3.0, used as an unmodified
    # dependency, not vendored.
    "arabic-reshaper>=3.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "python-bidi>=0.6.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party code, kept diffable against upstream rather than
# restyled. See `docs/third-party-licences.md`.
extend-exclude = [
    "scripts/baseline_reproduction",
    "src/arabic_mdd/data/_halabi_phonetiser.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# B905 (`zip(..., strict=True)`) is a Python 3.10+ keyword, and these modules
# have to stay importable under Python **3.8**: S3PRL requires 3.8, and
# `scripts/baseline_reproduction/ctc_cond/expert.py` imports `MddModel` from
# here inside that venv on the cluster so the two arms are one tested
# implementation rather than two. Every `zip` in these files either follows an
# explicit length check or iterates lists built in lockstep in `__init__`, so
# `strict=` was redundant belt-and-braces, not a guard being dropped.
# Nothing enforces the 3.8 ceiling automatically; `prepare_baseline.sh` fails
# loudly on import if it is ever broken.
"src/arabic_mdd/models/*.py" = ["B905"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
