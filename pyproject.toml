[project]
name = "arabic-mdd"
version = "0.1.0"
description = "Reference-aware evaluation of diacritization error propagation in Arabic mispronunciation detection"
readme = "README.md"
authors = [
    { name = "amndzdzdz", email = "zorrofx@gmx.net" }
]
requires-python = ">=3.12"
dependencies = [
    # Pinned, not floored: the RQ4 confidence path in
    # `arabic_mdd.diacritizers.catt` reads this release's private internals.
    "catt-tashkeel==1.0.2",
    "datasets>=5.0.1",
    "mishkal>=0.4.1",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party code, kept diffable against upstream rather than
# restyled. See `docs/third-party-licences.md`.
extend-exclude = [
    "scripts/baseline_reproduction",
    "src/arabic_mdd/data/_halabi_phonetiser.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
