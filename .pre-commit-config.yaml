repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Two paths are vendored verbatim from upstream and must stay
      # byte-for-byte identical to the commit they were taken from:
      # scripts/baseline_reproduction/ (see its README -- rewriting it makes a
      # failed baseline reproduction ambiguous) and the Halabi phonetiser,
      # whose pinned commit is asserted by arabic_mdd.data.phonetizer's
      # _PROVENANCE and its test. ruff already skips both via pyproject.toml's
      # extend-exclude; these hooks come from a different repo and don't read
      # it, so the exclusion has to be repeated here.
      - id: trailing-whitespace
        exclude: &vendored ^(scripts/baseline_reproduction/|src/arabic_mdd/data/_halabi_phonetiser\.py$)
      - id: end-of-file-fixer
        exclude: *vendored
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
